{% extends "base.html" %}

{% block content %}
<section class="work-area full" data-page="study" data-study-id="{{ study_id }}">
  <header class="page-head">
    <div>
      <p class="eyebrow">Результат анализа</p>
      <h1 id="studyTitle">Исследование</h1>
    </div>
    <div class="toolbar">
      <a class="btn ghost" href="/archive">Архив</a>
    </div>
  </header>

  <section class="study-layout">
    <section class="viewer-panel study-photo-panel">
      <div class="viewer-toolbar">
        <div>
          <strong id="studyFileName">Файл</strong>
          <span id="studyContainer">-</span>
        </div>
        <div class="toolbar compact">
          <button class="btn ghost small-btn active" id="showOverlay" type="button">Overlay</button>
          <button class="btn ghost small-btn" id="showPreview" type="button">Исходник</button>
        </div>
      </div>
      <a id="studyImageLink" href="#" target="_blank" rel="noopener">
        <img id="studyImage" class="study-photo" alt="DICOM image preview">
      </a>
    </section>

    <aside class="editor-side study-result-side">
      <div class="section-head">
        <p>Параметры</p>
      </div>

      <dl class="params-list study-params">
        <div><dt>Область</dt><dd id="studyRegion">-</dd></div>
        <div><dt>Сторона</dt><dd id="studyLaterality">-</dd></div>
        <div><dt>Класс</dt><dd id="studyQualityClass">-</dd></div>
        <div><dt>Нарушения</dt><dd id="studyViolations">-</dd></div>
        <div><dt>Время обработки</dt><dd id="studyTime">-</dd></div>
      </dl>

      <a class="btn primary full study-edit-action" id="studyEditBottom" href="/editor/{{ study_id }}">Редактировать</a>
    </aside>
  </section>
</section>
{% endblock %}
